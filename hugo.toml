baseURL = 'https://example.org/'
locale = 'en-us'
title = "Ananth Vyas"
theme = 'PaperMod'

[params]
  defaultTheme = 'auto'
  showReadingTime = true
  showShareButtons = false
  showPostNavLinks = true

[params.profileMode]
  enabled = true
  title = "Ananth Vyas"
  subtitle = "Hobby woodworker & wannabe storyteller."
  buttons = [
    { name = "Blog", url = "/posts/" },
    { name = "Woodworking", url = "/woodworking/" },
    { name = "Storytelling", url = "/stories/" }
  ]

[[menu.main]]
  identifier = "blog"
  name = "Blog"
  url = "/posts/"
  weight = 10

[[menu.main]]
  identifier = "woodworking"
  name = "Woodworking"
  url = "/woodworking/"
  weight = 20

[[menu.main]]
  identifier = "stories"
  name = "Storytelling"
  url = "/stories/"
  weight = 30
